name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      TAP_REPOSITORY: ${{ github.repository_owner }}/homebrew
    steps:
      - name: Check out the released source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      - name: Check formatting, lint, build web assets, and test
        run: make fmt-check lint web-test test-unit

      - name: Build macOS binaries
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          for arch in arm64 amd64; do
            package="paperless_${version}_darwin_${arch}"
            mkdir -p "dist/${package}"
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${version}" \
              -o "dist/${package}/paperless" \
              ./cmd/paperless
            cp README.md config.example.toml "dist/${package}/"
          done
          package="paperless_${version}_darwin_all"
          mkdir -p "dist/${package}"
          cp "dist/paperless_${version}_darwin_arm64/paperless" "dist/${package}/paperless-arm64"
          cp "dist/paperless_${version}_darwin_amd64/paperless" "dist/${package}/paperless-amd64"
          cp README.md config.example.toml "dist/${package}/"

      - name: Sign macOS binaries
        id: signing
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          REQUIRE_APPLE_SIGNING: ${{ vars.REQUIRE_APPLE_SIGNING }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE_BASE64" || -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            if [[ "$REQUIRE_APPLE_SIGNING" == "true" ]]; then
              echo "Apple signing is required, but the certificate or its password is missing." >&2
              exit 1
            fi
            echo "::warning::Developer ID secrets are missing; publishing unsigned archives. See docs/CODE_SIGNING.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${RELEASE_TAG#v}"
          certificate_path="$RUNNER_TEMP/paperless-developer-id.p12"
          developer_id_ca_path="$RUNNER_TEMP/DeveloperIDCA.cer"
          keychain_path="$RUNNER_TEMP/paperless-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path" "$developer_id_ca_path"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
            --output "$developer_id_ca_path"
          openssl x509 -inform DER -in "$developer_id_ca_path" -noout -subject | \
            grep -q 'Developer ID Certification Authority'
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path" >/dev/null
          security import "$developer_id_ca_path" -A -t cert -f x509 -k "$keychain_path" >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity was found in the supplied certificate." >&2
            exit 1
          fi

          for binary in \
            "dist/paperless_${version}_darwin_arm64/paperless" \
            "dist/paperless_${version}_darwin_amd64/paperless" \
            "dist/paperless_${version}_darwin_all/paperless-arm64" \
            "dist/paperless_${version}_darwin_all/paperless-amd64"; do
            verified=false
            for attempt in 1 2 3; do
              if codesign --force --options runtime --timestamp \
                --identifier com.coryoso.paperless \
                --keychain "$keychain_path" \
                --sign "$identity" \
                "$binary" && \
                codesign --verify --strict --verbose=2 "$binary" && \
                codesign -dvv "$binary" 2>&1 | grep -q '^Timestamp='; then
                verified=true
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "::warning::Signing attempt ${attempt} failed for ${binary}; retrying."
                sleep 5
              fi
            done
            if [[ "$verified" != "true" ]]; then
              echo "Could not create and verify a timestamped signature for ${binary}." >&2
              exit 1
            fi
          done

          # Verify again without the temporary keychain. This proves the complete
          # certificate chain is embedded and the signature works off-runner.
          cleanup
          trap - EXIT
          for binary in \
            "dist/paperless_${version}_darwin_arm64/paperless" \
            "dist/paperless_${version}_darwin_amd64/paperless" \
            "dist/paperless_${version}_darwin_all/paperless-arm64" \
            "dist/paperless_${version}_darwin_all/paperless-amd64"; do
            codesign --verify --strict --verbose=2 "$binary"
            codesign -dvv "$binary" 2>&1 | grep -q '^Authority=Developer ID Application:'
          done
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Notarize signed macOS binaries
        if: ${{ steps.signing.outputs.signed == 'true' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          REQUIRE_APPLE_NOTARIZATION: ${{ vars.REQUIRE_APPLE_NOTARIZATION }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_NOTARY_KEY_BASE64" || -z "$APPLE_NOTARY_KEY_ID" || -z "$APPLE_NOTARY_ISSUER_ID" ]]; then
            if [[ "$REQUIRE_APPLE_NOTARIZATION" == "true" ]]; then
              echo "Apple notarization is required, but one or more notary secrets are missing." >&2
              exit 1
            fi
            echo "::warning::Notary credentials are incomplete; publishing signed but unnotarized archives. See docs/CODE_SIGNING.md."
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          notarization_archive="dist/paperless-notarization.zip"
          cleanup() { rm -f "$notary_key_path" "$notarization_archive"; }
          trap cleanup EXIT
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$notary_key_path"
          ditto -c -k --keepParent "dist/paperless_${version}_darwin_all" "$notarization_archive"
          xcrun notarytool submit "$notarization_archive" \
            --key "$notary_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait

      - name: Package macOS archives
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for arch in arm64 amd64; do
            package="paperless_${version}_darwin_${arch}"
            tar -C dist -czf "dist/${package}.tar.gz" "$package"
          done
          package="paperless_${version}_darwin_all"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"

          verification_root="$RUNNER_TEMP/paperless-release-verification"
          mkdir -p "$verification_root"
          for package in \
            "paperless_${version}_darwin_arm64" \
            "paperless_${version}_darwin_amd64" \
            "paperless_${version}_darwin_all"; do
            mkdir -p "$verification_root/$package"
            tar -xzf "dist/${package}.tar.gz" -C "$verification_root/$package"
          done
          for binary in \
            "$verification_root/paperless_${version}_darwin_arm64/paperless_${version}_darwin_arm64/paperless" \
            "$verification_root/paperless_${version}_darwin_amd64/paperless_${version}_darwin_amd64/paperless" \
            "$verification_root/paperless_${version}_darwin_all/paperless_${version}_darwin_all/paperless-arm64" \
            "$verification_root/paperless_${version}_darwin_all/paperless_${version}_darwin_all/paperless-amd64"; do
            codesign --verify --strict --verbose=2 "$binary"
          done
          cd dist
          shasum -a 256 *.tar.gz > checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt --clobber

      - name: Check out the Homebrew tap
        if: ${{ !github.event.release.prerelease }}
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update the stable formula
        if: ${{ !github.event.release.prerelease }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          universal_sha="$(shasum -a 256 "dist/paperless_${version}_darwin_all.tar.gz" | awk '{print $1}')"
          mkdir -p homebrew-tap/Formula
          sed \
            -e "s|@SOURCE_REPOSITORY@|${SOURCE_REPOSITORY}|g" \
            -e "s|@VERSION@|${version}|g" \
            -e "s|@TAG@|${RELEASE_TAG}|g" \
            -e "s|@UNIVERSAL_SHA256@|${universal_sha}|g" \
            .github/homebrew/paperless.rb.tmpl > homebrew-tap/Formula/paperless.rb

      - name: Publish the formula
        if: ${{ !github.event.release.prerelease }}
        working-directory: homebrew-tap
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/paperless.rb
          if git diff --cached --quiet; then
            echo "Formula already matches ${RELEASE_TAG}"
          else
            git commit -m "paperless ${RELEASE_TAG}"
            git push
          fi
