# Optional shared delivery addresses. These can also be saved in Setup.
# Recipient-specific addresses can be entered when editing a recipient there.
recipient_addresses = [] # e.g. ["Musterstraße 12, 12345 Berlin"]

[paths]
inbox = "~/Paperless-Inbox"
raw = "~/Paperless/raw"
processing = "~/Paperless/processing"
archive = "~/Paperless/archive"
review = "~/Paperless/review"
rejected = "~/Paperless/rejected"
duplicates = "~/Paperless/duplicates"
logs = "~/Paperless/logs"
state_dir = "~/Library/Application Support/Paperless"
# Required before processing. Choose any existing locally accessible folder,
# including a folder synced by Dropbox, Google Drive, iCloud Drive, or OneDrive.
archive_root = ""

[service]
host = "127.0.0.1"
port = 8844
poll_seconds = 5
file_stability_seconds = 10

[ocr]
languages = ["deu", "eng"]
render_dpi = 300
crop_content = true
crop_padding_pixels = 30
min_crop_confidence = 0.75

# Set provider to "bonsai" for PrismML Bonsai, or "fm" for Apple Foundation Models via the local fm command.
# fm uses the system model; only enabled and timeout_seconds below also apply.
[llm]
provider = "ollama"
endpoint = "http://localhost:11434"
model = "qwen3.5:9b-q4_K_M"
enabled = true
timeout_seconds = 360
context_tokens = 16384
reasoning_tokens = 2048
max_output_tokens = 2048
keep_alive = "0"

# Bonsai server settings are separate from the Ollama endpoint/model above.
# Setup installs Bonsai-8B locally; existing servers can use another model ID.
[bonsai]
# Managed installation selects a free local port if this one is occupied, then saves it here.
endpoint = "http://127.0.0.1:8080"
model = "Bonsai-8B"

[policy]
auto_file_min_confidence = 92
min_approved_examples = 2
allow_new_top_level_folders = false
known_folders = []
discard_document_types = [
  "receipt",
  "delivery-receipt",
  "utility-information",
  "routine-invoice",
  "marketing",
]
keep_document_types = [
  "contract",
  "insurance-policy",
  "tax-letter",
  "government-letter",
  "legal-letter",
  "medical-document",
  "bank-document",
  "identity-document",
]

[sender_folders]

# Optional semantic comparisons, independent of the classification provider.
# Start local Ollama and run: ollama pull embeddinggemma
[embeddings]
enabled = false
endpoint = "http://127.0.0.1:11434"
model = "embeddinggemma"
timeout_seconds = 120
